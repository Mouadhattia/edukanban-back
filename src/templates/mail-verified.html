<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail Verified</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #fff;
        color: #000;
      }

      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        text-align: center;
        padding: 20px;
      }

      .card {
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      h1 {
        font-size: 2.2em;
        margin: 15px 0;
        font-weight: bold;
      }

      p {
        font-size: 1.1em;
        margin: 8px 0;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        text-decoration: none;
        color: #fff;
        background-color: #000;
        border-radius: 5px;
        transition: background-color 0.3s;
      }

      a:hover {
        background-color: #333;
      }

      .check-icon {
        font-size: 50px;
        color: green;
      }
    </style>
    <!-- Load Google Material Icons for check -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <span class="material-icons check-icon">check_circle</span>
        <h1>Mail Verification Success</h1>
        <p>Your email has been verified successfully.</p>
        <p>Thank you for using our service.</p>
        <p>Best regards,</p>

        <a href="http://localhost:3001/login">Back to Login</a>
      </div>
    </div>
  </body>
</html>
